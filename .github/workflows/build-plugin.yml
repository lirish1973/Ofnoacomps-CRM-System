name: Auto-Update Plugin Manifest

on:
  push:
    branches: [main]
    paths:
      - 'wordpress-plugin/ofnoacomps-crm/**/*.php'
      - 'wordpress-plugin/ofnoacomps-crm/*.php'
      - 'wordpress-plugin/ofnoacomps-crm/assets/**'
      - 'wordpress-plugin/ofnoacomps-postBadges/**/*.php'
      - 'wordpress-plugin/ofnoacomps-postBadges/*.php'
      - 'wordpress-plugin/ofnoacomps-postBadges/assets/**'

jobs:

  build-crm:
    name: Build ofnoacomps-crm
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if CRM files changed
        id: crm_changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep "^wordpress-plugin/ofnoacomps-crm/" || true)
          if [ -z "$CHANGED" ]; then echo "changed=false" >> $GITHUB_OUTPUT
          else echo "changed=true" >> $GITHUB_OUTPUT; fi

      - name: Extract CRM version
        id: meta
        if: steps.crm_changed.outputs.changed == 'true'
        run: |
          VERSION=$(grep -m1 "OFNOACOMPS_CRM_VERSION" wordpress-plugin/ofnoacomps-crm/ofnoacomps-crm.php | grep -oP "'\K[0-9.]+")
          [ -z "$VERSION" ] && exit 1
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Check manifest and built ZIP vs CRM version
        id: check
        if: steps.crm_changed.outputs.changed == 'true'
        run: |
          MV=$(python3 -c "import json; d=json.load(open('plugin-updates.json')); print(d['ofnoacomps-crm']['version'])")
          PV="${{ steps.meta.outputs.version }}"
          ZV=""
          if [ -f wordpress-plugin/ofnoacomps-crm.zip ]; then
            ZV=$(unzip -p wordpress-plugin/ofnoacomps-crm.zip ofnoacomps-crm/ofnoacomps-crm.php 2>/dev/null | grep -m1 "OFNOACOMPS_CRM_VERSION" | grep -oP "'\K[0-9.]+" || true)
          fi
          echo "plugin=$PV manifest=$MV zip=$ZV"
          if [ "$MV" = "$PV" ] && [ "$ZV" = "$PV" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build ofnoacomps-crm ZIP
        if: steps.crm_changed.outputs.changed == 'true' && steps.check.outputs.skip == 'false'
        run: |
          cd wordpress-plugin && rm -f ofnoacomps-crm.zip
          zip -r ofnoacomps-crm.zip ofnoacomps-crm/ --exclude "*.DS_Store" --exclude "*Thumbs.db"

      - name: Verify version inside built CRM ZIP
        if: steps.crm_changed.outputs.changed == 'true' && steps.check.outputs.skip == 'false'
        run: |
          ZV=$(unzip -p wordpress-plugin/ofnoacomps-crm.zip ofnoacomps-crm/ofnoacomps-crm.php | grep -m1 "OFNOACOMPS_CRM_VERSION" | grep -oP "'\K[0-9.]+")
          PV="${{ steps.meta.outputs.version }}"
          echo "zip=$ZV plugin=$PV"
          [ "$ZV" = "$PV" ] || { echo "::error::ZIP contains $ZV but plugin source is $PV"; exit 1; }

      - name: Update manifest (CRM)
        if: steps.crm_changed.outputs.changed == 'true' && steps.check.outputs.skip == 'false'
        run: |
          python3 - <<'PY'
          import json, os
          with open('plugin-updates.json','r',encoding='utf-8') as f: m=json.load(f)
          m['ofnoacomps-crm']['version']      = os.environ['PLUGIN_VERSION']
          m['ofnoacomps-crm']['last_updated'] = os.environ['TODAY']
          m['ofnoacomps-crm']['download_url'] = 'https://github.com/lirish1973/Ofnoacomps-CRM-System/raw/main/wordpress-plugin/ofnoacomps-crm.zip'
          with open('plugin-updates.json','w',encoding='utf-8') as f: json.dump(m,f,ensure_ascii=False,indent=2)
          PY
        env:
          PLUGIN_VERSION: ${{ steps.meta.outputs.version }}
          TODAY: ${{ steps.meta.outputs.today }}

      - name: Commit and push (CRM)
        if: steps.crm_changed.outputs.changed == 'true' && steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wordpress-plugin/ofnoacomps-crm.zip plugin-updates.json
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "auto: build ofnoacomps-crm v${{ steps.meta.outputs.version }} [skip ci]"
          git pull --rebase origin main && git push origin main

  build-postbadges:
    name: Build ofnoacomps-postBadges
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if postBadges files changed
        id: pb_changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep "^wordpress-plugin/ofnoacomps-postBadges/" || true)
          if [ -z "$CHANGED" ]; then echo "changed=false" >> $GITHUB_OUTPUT
          else echo "changed=true" >> $GITHUB_OUTPUT; fi

      - name: Extract postBadges version
        id: meta
        if: steps.pb_changed.outputs.changed == 'true'
        run: |
          VERSION=$(grep -m1 "OPB_VERSION" wordpress-plugin/ofnoacomps-postBadges/ofnoacomps-postBadges.php | grep -oP "'\K[0-9.]+")
          [ -z "$VERSION" ] && exit 1
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Check manifest and built ZIP vs postBadges version
        id: check
        if: steps.pb_changed.outputs.changed == 'true'
        run: |
          MV=$(python3 -c "import json; d=json.load(open('plugin-updates.json')); print(d['ofnoacomps-postBadges']['version'])")
          PV="${{ steps.meta.outputs.version }}"
          ZV=""
          if [ -f wordpress-plugin/ofnoacomps-postBadges.zip ]; then
            ZV=$(unzip -p wordpress-plugin/ofnoacomps-postBadges.zip ofnoacomps-postBadges/ofnoacomps-postBadges.php 2>/dev/null | grep -m1 "OPB_VERSION" | grep -oP "'\K[0-9.]+" || true)
          fi
          echo "plugin=$PV manifest=$MV zip=$ZV"
          if [ "$MV" = "$PV" ] && [ "$ZV" = "$PV" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build ofnoacomps-postBadges ZIP
        if: steps.pb_changed.outputs.changed == 'true' && steps.check.outputs.skip == 'false'
        run: |
          cd wordpress-plugin && rm -f ofnoacomps-postBadges.zip
          zip -r ofnoacomps-postBadges.zip ofnoacomps-postBadges/ --exclude "*.DS_Store" --exclude "*Thumbs.db"

      - name: Verify version inside built postBadges ZIP
        if: steps.pb_changed.outputs.changed == 'true' && steps.check.outputs.skip == 'false'
        run: |
          ZV=$(unzip -p wordpress-plugin/ofnoacomps-postBadges.zip ofnoacomps-postBadges/ofnoacomps-postBadges.php | grep -m1 "OPB_VERSION" | grep -oP "'\K[0-9.]+")
          PV="${{ steps.meta.outputs.version }}"
          echo "zip=$ZV plugin=$PV"
          [ "$ZV" = "$PV" ] || { echo "::error::ZIP contains $ZV but plugin source is $PV"; exit 1; }

      - name: Update manifest (postBadges)
        if: steps.pb_changed.outputs.changed == 'true' && steps.check.outputs.skip == 'false'
        run: |
          python3 - <<'PY'
          import json, os
          with open('plugin-updates.json','r',encoding='utf-8') as f: m=json.load(f)
          m['ofnoacomps-postBadges']['version']      = os.environ['PLUGIN_VERSION']
          m['ofnoacomps-postBadges']['last_updated'] = os.environ['TODAY']
          m['ofnoacomps-postBadges']['download_url'] = 'https://github.com/lirish1973/Ofnoacomps-CRM-System/raw/main/wordpress-plugin/ofnoacomps-postBadges.zip'
          with open('plugin-updates.json','w',encoding='utf-8') as f: json.dump(m,f,ensure_ascii=False,indent=2)
          PY
        env:
          PLUGIN_VERSION: ${{ steps.meta.outputs.version }}
          TODAY: ${{ steps.meta.outputs.today }}

      - name: Commit and push (postBadges)
        if: steps.pb_changed.outputs.changed == 'true' && steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wordpress-plugin/ofnoacomps-postBadges.zip plugin-updates.json
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "auto: build ofnoacomps-postBadges v${{ steps.meta.outputs.version }} [skip ci]"
          git pull --rebase origin main && git push origin main
